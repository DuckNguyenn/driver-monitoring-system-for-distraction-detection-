<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850"><title>09  Web giám sát và nhật ký</title><rect x="0" y="0" width="1200" height="850" rx="12" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.5"/><text x="48" y="40" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#126A78" text-anchor="start">DA2  /  THIẾT KẾ HỆ THỐNG</text><text x="1152" y="40" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#526776" text-anchor="end">BẢN DUYỆT  •  09</text><text x="48" y="85" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#183447" text-anchor="start">09  Web giám sát và nhật ký</text><text x="48" y="116" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#526776" text-anchor="start">Một tiến trình sở hữu camera; web hiển thị kết quả do hệ thống cung cấp.</text><polyline points="48,142 1152,142" fill="none" stroke="#EEF1F4" stroke-width="1.8"/><rect x="60" y="200" width="300" height="85" rx="12" fill="#EAF2FA" stroke="#617987" stroke-width="1.5"/><text x="210.0" y="236.0" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#183447" text-anchor="middle">Camera USB</text><text x="210.0" y="261.0" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#526776" text-anchor="middle">Một nguồn ảnh</text><rect x="450" y="200" width="300" height="85" rx="12" fill="#EAF2FA" stroke="#617987" stroke-width="1.5"/><text x="600.0" y="236.0" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#183447" text-anchor="middle">Tiến trình giám sát</text><text x="600.0" y="261.0" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#526776" text-anchor="middle">Nhận diện + quyết định</text><rect x="840" y="200" width="300" height="85" rx="12" fill="#FBE9E8" stroke="#617987" stroke-width="1.5"/><text x="990.0" y="236.0" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#183447" text-anchor="middle">ESP32 và còi</text><text x="990.0" y="261.0" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#526776" text-anchor="middle">Nhận yêu cầu cảnh báo</text><rect x="60" y="395" width="300" height="100" rx="12" fill="#EEF1F4" stroke="#617987" stroke-width="1.5"/><text x="210.0" y="426.0" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#183447" text-anchor="middle">Nhật ký phiên</text><text x="210.0" y="451.0" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#526776" text-anchor="middle">Xác suất, sự kiện, trạng thái</text><text x="210.0" y="476.0" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#526776" text-anchor="middle">Tổng hợp phiên</text><rect x="450" y="395" width="300" height="100" rx="12" fill="#EAF2FA" stroke="#617987" stroke-width="1.5"/><text x="600.0" y="426.0" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#183447" text-anchor="middle">Dịch vụ API trên Radxa</text><text x="600.0" y="451.0" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#526776" text-anchor="middle">Ảnh mới nhất + snapshot</text><text x="600.0" y="476.0" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#526776" text-anchor="middle">Truy vấn lịch sử phiên</text><rect x="840" y="395" width="300" height="100" rx="12" fill="#E7F3EE" stroke="#617987" stroke-width="1.5"/><text x="990.0" y="426.0" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#183447" text-anchor="middle">Kho trạng thái hiện tại</text><text x="990.0" y="451.0" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#526776" text-anchor="middle">Kết quả + ảnh chú thích</text><text x="990.0" y="476.0" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#526776" text-anchor="middle">Không chạy AI lần thứ hai</text><rect x="450" y="620" width="300" height="100" rx="12" fill="#E7F3EE" stroke="#617987" stroke-width="1.5"/><text x="600.0" y="651.0" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#183447" text-anchor="middle">Trình duyệt web</text><text x="600.0" y="676.0" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#526776" text-anchor="middle">Camera • trạng thái • biểu đồ</text><text x="600.0" y="701.0" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#526776" text-anchor="middle">Lịch sử phiên • xuất CSV</text><polyline points="360,242 450,242" fill="none" stroke="#617987" stroke-width="1.8"/><polygon points="450,242 440.0,238.0 440.0,246.0" fill="#617987"/><polyline points="750,242 840,242" fill="none" stroke="#617987" stroke-width="1.8"/><polygon points="840,242 830.0,238.0 830.0,246.0" fill="#617987"/><polyline points="520,285 520,335 210,335 210,395" fill="none" stroke="#617987" stroke-width="1.8"/><polygon points="210,395 214.0,385.0 206.0,385.0" fill="#617987"/><rect x="274.84765625" y="304" width="90.3046875" height="23" rx="3" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.5"/><text x="320" y="321" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#526776" text-anchor="middle">Ghi dữ liệu</text><polyline points="680,285 680,335 990,335 990,395" fill="none" stroke="#617987" stroke-width="1.8"/><polygon points="990,395 994.0,385.0 986.0,385.0" fill="#617987"/><rect x="809.53125" y="304" width="76.9375" height="23" rx="3" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.5"/><text x="848" y="321" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#526776" text-anchor="middle">Cập nhật</text><polyline points="360,445 450,445" fill="none" stroke="#617987" stroke-width="1.8"/><polygon points="450,445 440.0,441.0 440.0,449.0" fill="#617987"/><rect x="384.7734375" y="415" width="40.453125" height="23" rx="3" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.5"/><text x="405" y="432" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#526776"