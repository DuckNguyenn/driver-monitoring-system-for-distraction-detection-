<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850"><title>08  Cảnh báo qua ESP32</title><rect x="0" y="0" width="1200" height="850" rx="12" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.5"/><text x="48" y="40" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#126A78" text-anchor="start">DA2  /  THIẾT KẾ HỆ THỐNG</text><text x="1152" y="40" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#526776" text-anchor="end">BẢN DUYỆT  •  08</text><text x="48" y="85" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#183447" text-anchor="start">08  Cảnh báo qua ESP32</text><text x="48" y="116" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#526776" text-anchor="start">Lệnh điều khiển và ACK đi hai chiều; bộ tự ngắt hoạt động trên ESP32.</text><polyline points="48,142 1152,142" fill="none" stroke="#EEF1F4" stroke-width="1.8"/><rect x="75" y="180" width="310" height="75" rx="12" fill="#EAF2FA" stroke="#617987" stroke-width="1.5"/><text x="230.0" y="211.0" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#183447" text-anchor="middle">Radxa</text><text x="230.0" y="236.0" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#526776" text-anchor="middle">Quyết định cảnh báo</text><rect x="455" y="180" width="310" height="75" rx="12" fill="#EAF2FA" stroke="#617987" stroke-width="1.5"/><text x="610.0" y="211.0" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#183447" text-anchor="middle">ESP32 / ESP-IDF</text><text x="610.0" y="236.0" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#526776" text-anchor="middle">UART0 • 115200 baud</text><rect x="835" y="180" width="290" height="75" rx="12" fill="#EAF2FA" stroke="#617987" stroke-width="1.5"/><text x="980.0" y="211.0" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#183447" text-anchor="middle">Mạch đệm + buzzer</text><text x="980.0" y="236.0" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#526776" text-anchor="middle">GPIO25 active HIGH</text><polyline points="230,270 230,710" fill="none" stroke="#617987" stroke-width="1.8" stroke-dasharray="6 5"/><polyline points="610,270 610,710" fill="none" stroke="#617987" stroke-width="1.8" stroke-dasharray="6 5"/><polyline points="980,270 980,710" fill="none" stroke="#617987" stroke-width="1.8" stroke-dasharray="6 5"/><polyline points="230,320 610,320" fill="none" stroke="#617987" stroke-width="1.8"/><polygon points="610,320 600.0,316.0 600.0,324.0" fill="#617987"/><rect x="353.078125" y="287" width="133.84375" height="23" rx="3" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.5"/><text x="420" y="304" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#526776" text-anchor="middle">ALERT 1 &lt;lý do&gt;</text><polyline points="610,365 980,365" fill="none" stroke="#617987" stroke-width="1.8"/><polygon points="980,365 970.0,361.0 970.0,369.0" fill="#617987"/><rect x="723.1953125" y="332" width="143.609375" height="23" rx="3" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.5"/><text x="795" y="349" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#526776" text-anchor="middle">Bật GPIO25 → còi</text><polyline points="610,410 230,410" fill="none" stroke="#126A78" stroke-width="1.8"/><polygon points="230,410 240.0,414.0 240.0,406.0" fill="#126A78"/><rect x="367.76171875" y="377" width="104.4765625" height="23" rx="3" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.5"/><text x="420" y="394" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#526776" text-anchor="middle">OK ALERT 1</text><polyline points="230,475 610,475" fill="none" stroke="#617987" stroke-width="1.8"/><polygon points="610,475 600.0,471.0 600.0,479.0" fill="#617987"/><rect x="311.26953125" y="442" width="217.4609375" height="23" rx="3" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.5"/><text x="420" y="459" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#526776" text-anchor="middle">Gửi lại trạng thái mỗi 500 ms</text><polyline points="230,550 610,550" fill="none" stroke="#617987" stroke-width="1.8"/><polygon points="610,550 600.0,546.0 600.0,554.0" fill="#617987"/><rect x="325.5078125" y="517" width="188.984375" height="23" rx="3" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.5"/><text x="420" y="534" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#526776" text-anchor="middle">ALERT 0 khi hết yêu cầu</text><polyline points="610,590 980,590" fill="none" stroke="#617987" stroke-width="1.8"/><polygon points="980,590 970.0,586.0 970.0,594.0" fill="#617987"/><rect x="723.64453125" y="557" width="142.7109375" height="23" rx="3" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.5"/><text x="795" y="574" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#526776" text-anchor="middle">Tắt GPIO25 → còi</text><polyline points="610,630 230,630" fill="none" stroke="#126A78" stroke-width="1.8"/><polygon points="230,630 240.0,634.0 240.0,626.0" fill="#126A78"/><rect x="367.76171875" y="597" width="104.4765625" height="23" rx="3" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.5"/><text x="420" y="614" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#526776" text-anchor="middle">OK ALERT 0</text><text x="650" y="690" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#183447" text-anchor="start">Không có lệnh hợp lệ &gt; 2 giây:</text><text x="650" y="718" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#526776" text-anchor="start">ESP32 tự tắt còi; lỗi UART cũng tắt còi.</text><text x="48" y="758" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#526776" text-anchor="start">ACK xác nhận nhận lệnh, không xác nhận âm thanh. Host không giữ lệnh bật khi suy luận đã cũ.</text><polyline points="48,791 1152,791" fill="none" stroke="#EEF1F4" stroke-width="1.8"/><text x="48" y="820" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#526776" text-anchor="start">HỆ THỐNG GIÁM SÁT VÀ PHÁT HIỆN SỰ MẤT TẬP TRUNG CỦA TÀI XẾ</text><text x="1152" y="820" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#526776" text-anchor="end">14.11.2026  /  V1</text></svg>