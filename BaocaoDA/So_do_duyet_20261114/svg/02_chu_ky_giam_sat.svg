<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850"><title>02  Một chu kỳ giám sát</title><rect x="0" y="0" width="1200" height="850" rx="12" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.5"/><text x="48" y="40" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#126A78" text-anchor="start">DA2  /  THIẾT KẾ HỆ THỐNG</text><text x="1152" y="40" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#526776" text-anchor="end">BẢN DUYỆT  •  02</text><text x="48" y="85" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#183447" text-anchor="start">02  Một chu kỳ giám sát</text><text x="48" y="116" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#526776" text-anchor="start">Đọc từ trên xuống; nhánh thiếu bằng chứng luôn được ghi nhận riêng.</text><polyline points="48,142 1152,142" fill="none" stroke="#EEF1F4" stroke-width="1.8"/><rect x="390" y="170" width="340" height="60" rx="12" fill="#EAF2FA" stroke="#617987" stroke-width="1.5"/><text x="560.0" y="206.0" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#183447" text-anchor="middle">Lấy khung hình mới nhất</text><rect x="390" y="270" width="340" height="85" rx="12" fill="#EAF2FA" stroke="#617987" stroke-width="1.5"/><text x="560.0" y="306.0" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#183447" text-anchor="middle">Phát hiện mặt và cắt vùng</text><text x="560.0" y="331.0" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#526776" text-anchor="middle">Đánh giá chất lượng ảnh/mắt</text><rect x="390" y="395" width="340" height="85" rx="12" fill="#EAF2FA" stroke="#617987" stroke-width="1.5"/><text x="560.0" y="431.0" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#183447" text-anchor="middle">Suy luận khi ảnh dùng được</text><text x="560.0" y="456.0" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#526776" text-anchor="middle">Tạo quan sát + dấu thời gian</text><polygon points="560.0,520 710,575.0 560.0,630 410,575.0" fill="#FFF1D9" stroke="#617987" stroke-width="1.5"/><text x="560.0" y="569.5" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#183447" text-anchor="middle">Đủ bằng chứng</text><text x="560.0" y="592.5" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#183447" text-anchor="middle">cho quyết định?</text><rect x="830" y="532" width="300" height="85" rx="12" fill="#EEF1F4" stroke="#617987" stroke-width="1.5"/><text x="980.0" y="568.0" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#183447" text-anchor="middle">UNKNOWN</text><text x="980.0" y="593.0" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#526776" text-anchor="middle">Ngắt xác nhận liên quan</text><rect x="390" y="670" width="340" height="75" rx="12" fill="#E7F3EE" stroke="#617987" stroke-width="1.5"/><text x="560.0" y="701.0" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#183447" text-anchor="middle">Xuất trạng thái và lý do</text><text x="560.0" y="726.0" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#526776" text-anchor="middle">Luật quyết định ở hình 07</text><polyline points="560,230 560,270" fill="none" stroke="#617987" stroke-width="1.8"/><polygon points="560,270 564.0,260.0 556.0,260.0" fill="#617987"/><polyline points="560,355 560,395" fill="none" stroke="#617987" stroke-width="1.8"/><polygon points="560,395 564.0,385.0 556.0,385.0" fill="#617987"/><polyline points="560,480 560,520" fill="none" stroke="#617987" stroke-width="1.8"/><polygon points="560,520 564.0,510.0 556.0,510.0" fill="#617987"/><polyline points="710,575 830,575" fill="none" stroke="#617987" stroke-width="1.8"/><polygon points="830,575 820.0,571.0 820.0,579.0" fill="#617987"/><rect x="739.8671875" y="545" width="58.265625" height="23" rx="3" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.5"/><text x="769" y="562" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#526776" text-anchor="middle">Không</text><polyline points="560,630 560,670" fill="none" stroke="#617987" stroke-width="1.8"/><polygon points="560,670 564.0,660.0 556.0,660.0" fill="#617987"/><rect x="566.7734375" y="638" width="32.453125" height="23" rx="3" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.5"/><text x="583" y="655" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#526776" text-anchor="middle">Có</text><polyline points="980,617 980,707 730,707" fill="none" stroke="#617987" stroke-width="1.8"/><polygon points="730,707 740.0,711.0 740.0,703.0" fill="#617987"/><polyline points="390,707 280,707 280,200 390,200" fill="none" stroke="#617987" stroke-width="1.8"/><polygon points="390,200 380.0,196.0 380.0,204.0" fill="#617987"/><rect x="258.65234375" y="436" width="38.6953125" height="23" rx="3" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.5"/><text x="278" y="453" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#526776" text-anchor="middle">Lặp</text><text x="60" y="524" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#126A78" text-anchor="start">Sau mỗi lần cập nhật:</text><text x="60" y="555" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#183447" text-anchor="start">• Gửi yêu cầu còi</text><text x="60" y="585" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#183447" text-anchor="start">• Ghi nhật ký</text><text x="60" y="615" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#183447" text-anchor="start">• Cập nhật web nếu bật</text><text x="830" y="755" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#526776" text-anchor="start">Không suy thành “bình thường”.</text><polyline points="48,791 1152,791" fill="none" stroke="#EEF1F4" stroke-width="1.8"/><text x="48" y="820" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#526776" text-anchor="start">HỆ THỐNG GIÁM SÁT VÀ PHÁT HIỆN SỰ MẤT TẬP TRUNG CỦA TÀI XẾ</text><text x="1152" y="820" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#526776" text-anchor="end">14.11.2026  /  V1</text></svg>