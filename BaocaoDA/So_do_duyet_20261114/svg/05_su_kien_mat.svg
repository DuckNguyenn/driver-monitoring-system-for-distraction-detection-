<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850"><title>05  Từ trạng thái mắt đến blink</title><rect x="0" y="0" width="1200" height="850" rx="12" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.5"/><text x="48" y="40" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#126A78" text-anchor="start">DA2  /  THIẾT KẾ HỆ THỐNG</text><text x="1152" y="40" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#526776" text-anchor="end">BẢN DUYỆT  •  05</text><text x="48" y="85" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#183447" text-anchor="start">05  Từ trạng thái mắt đến blink</text><text x="48" y="116" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#526776" text-anchor="start">Tách rõ chu kỳ từng mắt, blink hai mắt và nhắm mắt kéo dài.</text><polyline points="48,142 1152,142" fill="none" stroke="#EEF1F4" stroke-width="1.8"/><rect x="60" y="185" width="1080" height="75" rx="12" fill="#EAF2FA" stroke="#617987" stroke-width="1.5"/><text x="600.0" y="216.0" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#183447" text-anchor="middle">Xác định trạng thái từng mắt</text><text x="600.0" y="241.0" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#526776" text-anchor="middle">P(Open) ≥ 0,8: mở  |  P(Closed) ≥ 0,8: nhắm  |  Còn lại: chưa chắc</text><rect x="70" y="320" width="460" height="95" rx="12" fill="#EAF2FA" stroke="#617987" stroke-width="1.5"/><text x="300.0" y="348.5" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#183447" text-anchor="middle">Chu kỳ của từng mắt</text><text x="300.0" y="373.5" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#526776" text-anchor="middle">Mở → Nhắm → Mở</text><text x="300.0" y="398.5" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#526776" text-anchor="middle">Xác nhận mở trở lại trong 0,1 giây</text><rect x="700" y="320" width="430" height="95" rx="12" fill="#EAF2FA" stroke="#617987" stroke-width="1.5"/><text x="915.0" y="361.0" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#183447" text-anchor="middle">Hai mắt cùng nhắm</text><text x="915.0" y="386.0" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#526776" text-anchor="middle">Theo dõi thời gian liên tục</text><rect x="70" y="470" width="460" height="95" rx="12" fill="#E7F3EE" stroke="#617987" stroke-width="1.5"/><text x="300.0" y="498.5" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#183447" text-anchor="middle">Ghi chu kỳ một mắt</text><text x="300.0" y="523.5" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#526776" text-anchor="middle">Khoảng nhắm ≥ 0,05 giây</text><text x="300.0" y="548.5" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#526776" text-anchor="middle">Chu kỳ dài vẫn là thông tin chẩn đoán</text><rect x="700" y="470" width="430" height="95" rx="12" fill="#FBE9E8" stroke="#617987" stroke-width="1.5"/><text x="915.0" y="511.0" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#183447" text-anchor="middle">Nhắm kéo dài ≥ 1,5 giây</text><text x="915.0" y="536.0" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#526776" text-anchor="middle">Tạo điều kiện ALERT</text><rect x="70" y="625" width="460" height="95" rx="12" fill="#E7F3EE" stroke="#617987" stroke-width="1.5"/><text x="300.0" y="653.5" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#183447" text-anchor="middle">Ghép thành một blink</text><text x="300.0" y="678.5" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#526776" text-anchor="middle">Mỗi chu kỳ: 0,05–0,5 giây</text><text x="300.0" y="703.5" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#526776" text-anchor="middle">Hai khoảng nhắm chồng nhau ≥ 0,05 giây</text><rect x="700" y="625" width="430" height="95" rx="12" fill="#FFF1D9" stroke="#617987" stroke-width="1.5"/><text x="915.0" y="653.5" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#183447" text-anchor="middle">Theo dõi tần suất blink</text><text x="915.0" y="678.5" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#526776" text-anchor="middle">So sánh hai cửa sổ 5 giây đầy đủ</text><text x="915.0" y="703.5" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#526776" text-anchor="middle">Hiện tại ≥ 4 và tăng ≥ 1 lần</text><polyline points="300,260 300,320" fill="none" stroke="#617987" stroke-width="1.8"/><polygon points="300,320 304.0,310.0 296.0,310.0" fill="#617987"/><polyline points="915,260 915,320" fill="none" stroke="#617987" stroke-width="1.8"/><polygon points="915,320 919.0,310.0 911.0,310.0" fill="#617987"/><polyline points="300,415 300,470" fill="none" stroke="#617987" stroke-width="1.8"/><polygon points="300,470 304.0,460.0 296.0,460.0" fill="#617987"/><polyline points="300,565 300,625" fill="none" stroke="#617987" stroke-width="1.8"/><polygon points="300,625 304.0,615.0 296.0,615.0" fill="#617987"/><polyline points="915,415 915,470" fill="none" stroke="#617987" stroke-width="1.8"/><polygon points="915,470 919.0,460.0 911.0,460.0" fill="#617987"/><polyline points="530,672 700,672" fill="none" stroke="#617987" stroke-width="1.8"/><polygon points="700,672 690.0,668.0 690.0,676.0" fill="#617987"/><text x="48" y="756" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#526776" text-anchor="start">Mất/ảnh kém: ngắt chu kỳ. Chuyển tiếp chưa chắc chỉ được nối trong khoảng ân hạn 0,15 giây.</text><polyline points="48,791 1152,791" fill="none" stroke="#EEF1F4" stroke-width="1.8"/><text x="48" y="820" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#526776" text-anchor="start">HỆ THỐNG GIÁM SÁT VÀ PHÁT HIỆN SỰ MẤT TẬP TRUNG CỦA TÀI XẾ</text><text x="1152" y="820" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#526776" text-anchor="end">14.11.2026  /  V1</text></svg>