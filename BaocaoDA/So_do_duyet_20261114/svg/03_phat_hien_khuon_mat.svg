<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850"><title>03  Từ khung hình đến vùng quan tâm</title><rect x="0" y="0" width="1200" height="850" rx="12" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.5"/><text x="48" y="40" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#126A78" text-anchor="start">DA2  /  THIẾT KẾ HỆ THỐNG</text><text x="1152" y="40" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#526776" text-anchor="end">BẢN DUYỆT  •  03</text><text x="48" y="85" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#183447" text-anchor="start">03  Từ khung hình đến vùng quan tâm</text><text x="48" y="116" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#526776" text-anchor="start">Ảnh thu nhỏ dùng để phát hiện; các vùng phân loại được cắt từ ảnh gốc.</text><polyline points="48,142 1152,142" fill="none" stroke="#EEF1F4" stroke-width="1.8"/><rect x="60" y="190" width="290" height="85" rx="12" fill="#EAF2FA" stroke="#617987" stroke-width="1.5"/><text x="205.0" y="226.0" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#183447" text-anchor="middle">Khung hình camera</text><text x="205.0" y="251.0" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#526776" text-anchor="middle">Giữ ảnh gốc để cắt vùng</text><rect x="440" y="190" width="290" height="85" rx="12" fill="#EAF2FA" stroke="#617987" stroke-width="1.5"/><text x="585.0" y="226.0" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#183447" text-anchor="middle">Co ảnh + đệm viền</text><text x="585.0" y="251.0" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#526776" text-anchor="middle">Letterbox 320 × 320</text><rect x="820" y="190" width="320" height="85" rx="12" fill="#EAF2FA" stroke="#617987" stroke-width="1.5"/><text x="980.0" y="226.0" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#183447" text-anchor="middle">YuNet</text><text x="980.0" y="251.0" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#526776" text-anchor="middle">Hộp mặt + 5 điểm mốc</text><rect x="820" y="350" width="320" height="85" rx="12" fill="#EAF2FA" stroke="#617987" stroke-width="1.5"/><text x="980.0" y="386.0" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#183447" text-anchor="middle">Đổi về tọa độ ảnh gốc</text><text x="980.0" y="411.0" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#526776" text-anchor="middle">Lọc vùng lái xe, cỡ khuôn mặt</text><polygon points="590.0,345 730,395.0 590.0,445 450,395.0" fill="#FFF1D9" stroke="#617987" stroke-width="1.5"/><text x="590.0" y="389.5" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#183447" text-anchor="middle">Đúng một mặt</text><text x="590.0" y="412.5" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#183447" text-anchor="middle">đạt điều kiện?</text><rect x="60" y="350" width="290" height="85" rx="12" fill="#E7F3EE" stroke="#617987" stroke-width="1.5"/><text x="205.0" y="386.0" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#183447" text-anchor="middle">Cắt vùng từ ảnh gốc</text><text x="205.0" y="411.0" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#526776" text-anchor="middle">Hai mắt + toàn mặt mở rộng</text><rect x="60" y="530" width="290" height="100" rx="12" fill="#EAF2FA" stroke="#617987" stroke-width="1.5"/><text x="205.0" y="561.0" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#183447" text-anchor="middle">Kiểm tra chất lượng</text><text x="205.0" y="586.0" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#526776" text-anchor="middle">Độ sáng, độ nét, hình học</text><text x="205.0" y="611.0" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#526776" text-anchor="middle">Độ ổn định của vùng mắt</text><rect x="440" y="530" width="290" height="100" rx="12" fill="#E7F3EE" stroke="#617987" stroke-width="1.5"/><text x="585.0" y="573.5" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#183447" text-anchor="middle">Sang bộ phân loại</text><text x="585.0" y="598.5" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#526776" text-anchor="middle">Mang theo cờ chất lượng</text><rect x="820" y="530" width="320" height="100" rx="12" fill="#EEF1F4" stroke="#617987" stroke-width="1.5"/><text x="980.0" y="573.5" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#183447" text-anchor="middle">Không dùng quan sát mặt</text><text x="980.0" y="598.5" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#526776" text-anchor="middle">Mất mặt / mặt nhỏ / nhiều mặt</text><polyline points="350,232 440,232" fill="none" stroke="#617987" stroke-width="1.8"/><polygon points="440,232 430.0,228.0 430.0,236.0" fill="#617987"/><polyline points="730,232 820,232" fill="none" stroke="#617987" stroke-width="1.8"/><polygon points="820,232 810.0,228.0 810.0,236.0" fill="#617987"/><polyline points="980,275 980,350" fill="none" stroke="#617987" stroke-width="1.8"/><polygon points="980,350 984.0,340.0 976.0,340.0" fill="#617987"/><polyline points="820,392 730,392" fill="none" stroke="#617987" stroke-width="1.8"/><polygon points="730,392 740.0,396.0 740.0,388.0" fill="#617987"/><polyline points="450,395 350,395" fill="none" stroke="#617987" stroke-width="1.8"/><polygon points="350,395 360.0,399.0 360.0,391.0" fill="#617987"/><rect x="383.7734375" y="362" width="32.453125" height="23" rx="3" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.5"/><text x="400" y="379" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#526776" text-anchor="middle">Có</text><polyline points="590,445 590,480 980,480 980,530" fill="none" stroke="#617987" stroke-width="1.8"/><polygon points="980,530 984.0,520.0 976.0,520.0" fill="#617987"/><rect x="750.8671875" y="448" width="58.265625" height="23" rx="3" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.5"/><text x="780" y="465" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#526776" text-anchor="middle">Không</text><polyline points="205,435 205,530" fill="none" stroke="#617987" stroke-width="1.8"/><polygon points="205,530 209.0,520.0 201.0,520.0" fill="#617987"/><polyline points="350,580 440,580" fill="none" stroke="#617987" stroke-width="1.8"/><polygon points="440,580 430.0,576.0 430.0,584.0" fill="#617987"/><polyline points="205,275 205,350" fill="none" stroke="#617987" stroke-width="1.8" stroke-dasharray="6 5"/><polygon points="205,350 209.0,340.0 201.0,340.0" fill="#617987"/><rect x="169.64453125" y="299" width="70.7109375" height="23" rx="3" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.5"/><text x="205" y="316" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#526776" text-anchor="middle">Ảnh gốc</text><text x="48" y="690" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#526776" text-anchor="start">Năm điểm mốc: hai mắt, mũi và hai khóe miệng. YuNet không kết luận buồn ngủ.</text><text x="48" y="715" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#526776" text-anchor="start">Chất lượng vùng mắt và chất lượng toàn mặt được giữ riêng để xử lý theo từng kênh.</text><polyline points="48,791 1152,791" fill="none" stroke="#EEF1F4" stroke-width="1.8"/><text x="48" y="820" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#526776" text-anchor="start">HỆ THỐNG GIÁM SÁT VÀ PHÁT HIỆN SỰ MẤT TẬP TRUNG CỦA TÀI XẾ</text><text x="1152" y="820" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#526776" text-anchor="end">14.11.2026  /  V1</text></svg>