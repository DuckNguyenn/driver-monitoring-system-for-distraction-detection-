<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850"><title>06  Xác nhận một đợt ngáp</title><rect x="0" y="0" width="1200" height="850" rx="12" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.5"/><text x="48" y="40" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#126A78" text-anchor="start">DA2  /  THIẾT KẾ HỆ THỐNG</text><text x="1152" y="40" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#526776" text-anchor="end">BẢN DUYỆT  •  06</text><text x="48" y="85" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#183447" text-anchor="start">06  Xác nhận một đợt ngáp</text><text x="48" y="116" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#526776" text-anchor="start">Dùng hai ngưỡng và thời gian xác nhận để tránh đếm lặp một đợt.</text><polyline points="48,142 1152,142" fill="none" stroke="#EEF1F4" stroke-width="1.8"/><rect x="60" y="185" width="300" height="90" rx="12" fill="#EAF2FA" stroke="#617987" stroke-width="1.5"/><text x="210.0" y="223.5" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#183447" text-anchor="middle">Xác suất ngáp hợp lệ</text><text x="210.0" y="248.5" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#526776" text-anchor="middle">P(yawn) từ model</text><rect x="440" y="185" width="300" height="90" rx="12" fill="#EAF2FA" stroke="#617987" stroke-width="1.5"/><text x="590.0" y="223.5" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#183447" text-anchor="middle">Làm mượt EMA</text><text x="590.0" y="248.5" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#526776" text-anchor="middle">Hằng số thời gian 0,2 giây</text><rect x="830" y="185" width="310" height="90" rx="12" fill="#EAF2FA" stroke="#617987" stroke-width="1.5"/><text x="985.0" y="223.5" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#183447" text-anchor="middle">Theo dõi đợt ngáp</text><text x="985.0" y="248.5" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#526776" text-anchor="middle">Chưa ngáp / đang ngáp</text><rect x="80" y="375" width="300" height="110" rx="12" fill="#EAF2FA" stroke="#617987" stroke-width="1.5"/><text x="230.0" y="423.5" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#183447" text-anchor="middle">CHƯA NGÁP</text><text x="230.0" y="448.5" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#526776" text-anchor="middle">Đang chờ điều kiện vào đợt</text><rect x="820" y="375" width="300" height="110" rx="12" fill="#E7F3EE" stroke="#617987" stroke-width="1.5"/><text x="970.0" y="411.0" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#183447" text-anchor="middle">ĐANG NGÁP</text><text x="970.0" y="436.0" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#526776" text-anchor="middle">Tăng bộ đếm đúng 1 lần</text><text x="970.0" y="461.0" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#526776" text-anchor="middle">khi vừa vào trạng thái này</text><polyline points="360,230 440,230" fill="none" stroke="#617987" stroke-width="1.8"/><polygon points="440,230 430.0,226.0 430.0,234.0" fill="#617987"/><polyline points="740,230 830,230" fill="none" stroke="#617987" stroke-width="1.8"/><polygon points="830,230 820.0,226.0 820.0,234.0" fill="#617987"/><polyline points="985,275 985,310 230,310 230,375" fill="none" stroke="#617987" stroke-width="1.8"/><polygon points="230,375 234.0,365.0 226.0,365.0" fill="#617987"/><rect x="513.84765625" y="282" width="72.3046875" height="23" rx="3" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.5"/><text x="550" y="299" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#526776" text-anchor="middle">Khởi tạo</text><polyline points="380,400 820,400" fill="none" stroke="#617987" stroke-width="1.8"/><polygon points="820,400 810.0,396.0 810.0,404.0" fill="#617987"/><rect x="506.50390625" y="370" width="186.9921875" height="23" rx="3" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.5"/><text x="600" y="387" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#526776" text-anchor="middle">P ≥ 0,70 liên tục ≥ 1 giây</text><polyline points="820,465 380,465" fill="none" stroke="#617987" stroke-width="1.8"/><polygon points="380,465 390.0,469.0 390.0,461.0" fill="#617987"/><rect x="499.83203125" y="434" width="200.3359375" height="23" rx="3" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.5"/><text x="600" y="451" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#526776" text-anchor="middle">P ≤ 0,35 liên tục ≥ 0,5 giây</text><rect x="80" y="595" width="470" height="105" rx="12" fill="#FFF1D9" stroke="#617987" stroke-width="1.5"/><text x="315.0" y="628.5" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#183447" text-anchor="middle">Bộ đếm trong 60 giây</text><text x="315.0" y="653.5" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#526776" text-anchor="middle">Một đợt: ghi nhật ký</text><text x="315.0" y="678.5" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#526776" text-anchor="middle">Từ hai đợt: điều kiện “ngáp nhiều”</text><rect x="670" y="595" width="450" height="105" rx="12" fill="#EEF1F4" stroke="#617987" stroke-width="1.5"/><text x="895.0" y="628.5" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#183447" text-anchor="middle">Dữ liệu ngáp bị thiếu</text><text x="895.0" y="653.5" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#526776" text-anchor="middle">Xóa bộ lọc và thời gian xác nhận</text><text x="895.0" y="678.5" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#526776" text-anchor="middle">Không tự tạo thêm đợt ngáp</text><polyline points="970,485 970,540 315,540 315,595" fill="none" stroke="#617987" stroke-width="1.8"/><polygon points="315,595 319.0,585.0 311.0,585.0" fill="#617987"/><rect x="537.1484375" y="510" width="125.703125" height="23" rx="3" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.5"/><text x="600" y="527" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#526776" text-anchor="middle">Sự kiện vào đợt</text><text x="48" y="746" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#526776" text-anchor="start">Trong khoảng giữa hai ngưỡng, giữ trạng thái đợt. Chưa đủ thời gian xác nhận thì chưa chuyển.</text><polyline points="48,791 1152,791" fill="none" stroke="#EEF1F4" stroke-width="1.8"/><text x="48" y="820" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#526776" text-anchor="start">HỆ THỐNG GIÁM SÁT VÀ PHÁT HIỆN SỰ MẤT TẬP TRUNG CỦA TÀI XẾ</text><text x="1152" y="820" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#526776" text-anchor="end">14.11.2026  /  V1</text></svg>