or="middle">Radxa ROCK 4D</text><text x="575.0" y="308.5" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#526776" text-anchor="middle">RK3576 • Nhận ảnh camera</text><rect x="405" y="385" width="340" height="100" rx="12" fill="#EAF2FA" stroke="#617987" stroke-width="1.5"/><text x="575.0" y="428.5" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#183447" text-anchor="middle">Nhận diện bằng AI</text><text x="575.0" y="453.5" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#526776" text-anchor="middle">YuNet + phân loại mắt/ngáp</text><rect x="405" y="530" width="340" height="100" rx="12" fill="#E7F3EE" stroke="#617987" stroke-width="1.5"/><text x="575.0" y="573.5" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#183447" text-anchor="middle">Đánh giá theo thời gian</text><text x="575.0" y="598.5" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#526776" text-anchor="middle">Trạng thái + lý do cảnh báo</text><rect x="850" y="230" width="290" height="95" rx="12" fill="#FFF1D9" stroke="#617987" stroke-width="1.5"/><text x="995.0" y="271.0" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#183447" text-anchor="middle">ESP32-WROOM-32</text><text x="995.0" y="296.0" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#526776" text-anchor="middle">Firmware ESP-IDF</text><rect x="850" y="375" width="290" height="75" rx="12" fill="#FBE9E8" stroke="#617987" stroke-width="1.5"/><text x="995.0" y="406.0" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#183447" text-anchor="middle">Còi buzzer</text><text x="995.0" y="431.0" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#526776" text-anchor="middle">Cảnh báo tại chỗ</text><rect x="850" y="510" width="290" height="75" rx="12" fill="#EEF1F4" stroke="#617987" stroke-width="1.5"/><text x="995.0" y="541.0" font-family="Arial, sans-serif"